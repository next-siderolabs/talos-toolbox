name: OpenCode PR Review

# Automatic review on every PR into main/master, plus on-demand: a maintainer
# comments `/oc` or `/opencode` on a pull request (conversation tab or an inline
# code comment) and the agent replies in the PR.
on:
  pull_request:
    branches: [ "main", "master" ]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: opencode-review-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  review:
    # Automatic for PRs from branches of this repo itself (only people with write
    # access can create those); on-demand for `/oc` comments from people with repo
    # access: the agent runs on our self-hosted runner with the Strata key, so fork
    # PRs and outside commenters must not be able to start it. shortcut: fork PRs
    # from collaborators still skip; upgrade if review-on-forks is ever wanted
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        (github.event_name == 'pull_request_review_comment' || github.event.issue.pull_request) &&
        (contains(github.event.comment.body, '/oc') || contains(github.event.comment.body, '/opencode')) &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    runs-on:
      group: self-hosted-gh-runner-docker
      labels: [self-hosted, Linux, X64]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        # Keep the token in the git config: with use_github_token the action fetches the
        # PR branch itself and sets up no git credentials of its own
        with:
          fetch-depth: 1

      - name: Verify Strata endpoint
        env:
          STRATA_BASE_URL: ${{ vars.STRATA_BASE_URL }}
          STRATA_API_KEY: ${{ secrets.STRATA_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          : "${STRATA_BASE_URL:?Set repository variable STRATA_BASE_URL}"
          : "${STRATA_API_KEY:?Set repository secret STRATA_API_KEY}"

          curl --fail --silent --show-error \
            --max-time 15 \
            -H "Authorization: Bearer ${STRATA_API_KEY}" \
            "${STRATA_BASE_URL%/}/models" \
            -o /dev/null

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          STRATA_BASE_URL: ${{ vars.STRATA_BASE_URL }}
          STRATA_API_KEY: ${{ secrets.STRATA_API_KEY }}
          # Inline config has the highest precedence, so an opencode.json added by the
          # PR under review cannot redirect the provider (and its key) elsewhere
          OPENCODE_CONFIG_CONTENT: |
            {
              "$schema": "https://opencode.ai/config.json",
              "provider": {
                "strata": {
                  "npm": "@ai-sdk/openai-compatible",
                  "name": "Strata Local",
                  "options": {
                    "baseURL": "{env:STRATA_BASE_URL}",
                    "apiKey": "{env:STRATA_API_KEY}",
                    "timeout": 600000
                  },
                  "models": {
                    "qwen3.8-flash-next-iq3_xxs": {
                      "name": "Qwen3.8 Flash Next IQ3_XXS",
                      "limit": {
                        "context": 262144,
                        "output": 8192
                      }
                    }
                  }
                }
              },
              "model": "strata/qwen3.8-flash-next-iq3_xxs"
            }
        with:
          model: strata/qwen3.8-flash-next-iq3_xxs
          use_github_token: true
          share: false
