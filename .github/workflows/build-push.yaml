name: Build and Push Talos Toolbox

on:
  # Every push to the default branch, so the sha-<commit> tag the plugin
  # resolves from the GitHub API always exists in the registry
  push:
    branches: [ "main", "master" ]
  # Build-only on pull requests, so renovate automerge has a passing check to gate on
  pull_request:
    branches: [ "main", "master" ]
  schedule:
    # Weekly rebuild to pick up fresh apk packages
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      pull-requests: read

    steps:
      # A push to main must be the merge of a PR whose OpenCode review check passed;
      # cron rebuilds and manual dispatches have no PR and skip the check
      - name: 🔍 Verify the merge was reviewed
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${{ github.repository }}"
          pr=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "$api/commits/$GITHUB_SHA/pulls" | jq -r '.[0].number // empty')
          [ -n "$pr" ] || { echo "::error::push to main must come from a merged PR"; exit 1; }
          head=$(curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "$api/pulls/$pr" | jq -r .head.sha)
          curl -fsSL -H "Authorization: Bearer ${{ github.token }}" \
            "$api/commits/$head/check-runs?per_page=100" |
            jq -e '[.check_runs[] | select(.name == "review" and .conclusion == "success")] | length > 0' \
            > /dev/null || { echo "::error::PR #${pr} has no passing OpenCode review check"; exit 1; }

      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value={{date 'YYYYMMDD'}},enable={{is_default_branch}}
            type=sha,format=short

      - name: 🚀 Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
